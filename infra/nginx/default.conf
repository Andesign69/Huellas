# WBS Chapter 8, stage B (final): TLS live for both hostnames, one cert
# covering both as SANs (rastreahuellas.com + staging.rastreahuellas.com —
# certbot names the cert directory after the first domain listed). Plain
# HTTP now just redirects to HTTPS, except the ACME challenge path, kept
# alive for renewals.

map $host $app_upstream {
    default                     app-prod:3000;
    staging.rastreahuellas.com  app-staging:3000;
}

map $host $uploads_env {
    default                     prod;
    staging.rastreahuellas.com  staging;
}

server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name rastreahuellas.com staging.rastreahuellas.com;

    ssl_certificate /etc/letsencrypt/live/rastreahuellas.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rastreahuellas.com/privkey.pem;

    # Docker's embedded DNS (service name -> container IP) is only used at
    # request time when proxy_pass targets a variable, not a literal — needs
    # an explicit resolver instead of nginx's normal build-time upstream
    # resolution.
    resolver 127.0.0.11 valid=30s;

    # Coincide con el límite de 8MB de /api/upload (src/app/api/upload/route.ts)
    # más margen para la codificación multipart.
    client_max_body_size 10m;

    # Fotos servidas directo desde disco, sin pasar por la app — mismo
    # patrón/nombres de archivo que src/app/photos/[...path]/route.ts usa en
    # desarrollo local. Cualquier cosa que no matchee el patrón cae al 404
    # de abajo en vez de intentar servirse. $uploads_env separa prod/staging
    # por hostname, mismo mecanismo que $app_upstream.
    location ~ ^/photos/(?<photofile>[a-f0-9-]+\.(jpg|png|webp))$ {
        alias /uploads/$uploads_env/$photofile;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /photos/ {
        return 404;
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Crítico: src/lib/request-ip.ts confía en este header para el rate
        # limiting por IP de submit_report()/flag_report()/suggest_shelter().
        # Solo es seguro porque los contenedores de la app no tienen puerto
        # público propio — nginx es la única entrada, nadie puede spoofear
        # este header saltándose nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
